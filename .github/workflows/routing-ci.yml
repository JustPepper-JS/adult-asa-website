name: Website routing verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic routing, session-boundary and privacy checks
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm run check 2>&1 | tee .ci-evidence/routing-tests.log
      - name: Preserve exact evidence and limitations even after a failure
        if: always()
        run: |
          mkdir -p .ci-evidence
          git rev-parse HEAD > .ci-evidence/commit.txt
          git ls-files -z | xargs -0 sha256sum > .ci-evidence/source-sha256.txt
          printf '%s\n' 'Real Discord owner/non-owner browser login NOT RUN by this job.' 'Passing fixture tests do not establish real consent or production deployment.' 'No production credentials, game writes or paid services used.' > .ci-evidence/LIMITATIONS.txt
          find .ci-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > .ci-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-evidence-${{ github.run_id }}
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
# Mandatory timeout-safe handoff: report COMPLETED/INCOMPLETE/BLOCKED/UNVERIFIED,
# exact errors, paths, tests PASS/FAIL/NOT RUN, artifacts, hashes and continuation.
# Never count skipped or incomplete validation as passing. No automatic merge.
