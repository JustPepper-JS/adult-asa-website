name: W3 community visual preview (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - community.html
      - mods.html
      - assets/site.js
      - assets/site.css
      - assets/community.js
      - assets/community.css
      - assets/community-content.json
      - tests/browser/w3-preview.mjs
      - .github/workflows/community-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture Adult ASA original desktop and mobile UI
        env:
          REXY_PREVIEW_DIR: w3-browser-preview
        run: node tests/browser/w3-preview.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-community-preview-${{ github.run_id }}
          path: w3-browser-preview/
          retention-days: 7
          if-no-files-found: warn
# Reads only repository files. No Cloudflare/Railway/Discord/Nitrado credentials
# and no deployment. PR owner review is required before production changes.
